name: Cargo Deny

on:
  workflow_call:
  schedule:
    - cron: "0 0 * * MON" # Weekly on Monday

jobs:
  cargo-deny:
    name: License and Security Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources

    # Separate called/scheduled workflows and each matrix leg from the caller.
    concurrency:
      group: cargo-deny-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.checks }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install and run cargo-deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --all-features check ${{ matrix.checks }}
