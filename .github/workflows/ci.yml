name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/*.md"
      - "LICENSE*"
      - ".gitignore"
      - ".env.example"
  # Run the complete gate for every pull request, including stacked PRs that
  # target a feature branch and documentation-only changes. This guarantees
  # that the stable "CI Status" check is always emitted.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 1
  RUSTFLAGS: "-C debuginfo=0"
  CARGO_NET_RETRY: 10

# Cancel previous runs of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Quick checks run first and fail fast
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v1-rust"
          shared-key: "quick"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Unit tests for each package in parallel
  test-unit:
    name: Unit Tests - ${{ matrix.package }}
    needs: quick-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Target flags are per-package: redisctl is bin-only (no lib target),
        # so --lib would error there, while redisctl-core has no bin. --bins
        # runs the tests in main.rs (the MCP safety-tier registration tests),
        # which ci-status would otherwise not gate.
        include:
          - package: redisctl-core
            targets: "--lib"
          - package: redisctl
            targets: "--bins"
          - package: redisctl-mcp
            targets: "--lib --bins"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v1-rust"
          shared-key: "test-${{ matrix.package }}"

      - name: Run unit tests
        run: cargo test --package ${{ matrix.package }} ${{ matrix.targets }} --all-features

  # Integration tests
  test-integration:
    name: Integration Tests
    needs: quick-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v1-rust"
          shared-key: "integration"

      - name: Run integration tests
        run: cargo test --workspace --test '*' --all-features

  # Platform builds - only required for main branch and releases
  build-platforms:
    name: Build - ${{ matrix.os }}
    needs: [test-unit, test-integration]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
          - os: macos-latest
            required: false
          - os: windows-latest
            required: false
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v1-rust"
          shared-key: "build"

      - name: Build binary
        run: cargo build --release --bin redisctl

      # Only run full tests on Linux (fastest platform)
      - name: Run all tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --all-features

  # Code coverage - only on main branch
  coverage:
    name: Code Coverage
    needs: [test-unit, test-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v1-rust"
          shared-key: "coverage"

      - name: Install tarpaulin
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-tarpaulin@0.31.2

      - name: Generate coverage
        run: cargo tarpaulin --workspace --all-features --out xml --timeout 300

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # Final status check - ensures all required jobs passed
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quick-checks, test-unit, test-integration, build-platforms]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.quick-checks.result }}" != "success" ]]; then
            echo "Quick checks failed"
            exit 1
          fi
          if [[ "${{ needs.test-unit.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.test-integration.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          # Build platforms can have failures for non-Linux
          echo "CI passed!"
