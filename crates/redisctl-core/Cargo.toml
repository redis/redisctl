[package]
name = "redisctl-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for Redis CLI tools - config, workflows, and shared logic"

[dependencies]
# API clients
redis-cloud = { workspace = true }
redis-enterprise = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }

# OAuth2/OIDC for the Okta login flows (device authorization / auth-code loopback), via the
# maintained oauth2 crate. reqwest is the async HTTP backend it uses.
oauth2 = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

# Free-tier provisioning + dotenv delivery (cloud::quick_database / cloud::env_delivery)
chrono = { workspace = true }
urlencoding = { workspace = true }

# Logging
tracing = { workspace = true }

# Config support
directories = { workspace = true }
shellexpand = { workspace = true }
clap = { workspace = true }

# Optional: Secure credential storage
keyring = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serial_test = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
secure-storage = ["dep:keyring"]
